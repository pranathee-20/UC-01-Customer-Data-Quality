# A alembic configuration file for SQLAlchemy 2.0 Core + Azure SQL

[alembic]
script_location = migrations
prepend_sys_path = .
version_locations = %(here)s/migrations/versions
sqlalchemy.url = mssql+pyodbc://sa:YourStrongPassword123@localhost:1433/customer_quality_db?driver=ODBC+Driver+18+for+SQL+Server&Encrypt=yes&TrustServerCertificate=yes

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%s(asctime)s] %(name)s: %(message)s
datefmt = %H:%M:%S
